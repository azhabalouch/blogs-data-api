<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Upload - Simple</title>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        .section:last-child {
            border-bottom: none;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .file-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .file-label {
            display: block;
            padding: 20px;
            background: #f9f9ff;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-label:hover {
            background: #f0f7ff;
        }
        input[type="file"] {
            display: none;
        }
        .file-name {
            margin-top: 8px;
            font-size: 14px;
            color: #667eea;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-right: 10px;
        }
        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .preview-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Simple Blog Uploader</h1>
        
        <!-- GitHub Config Section -->
        <div class="section">
            <h2>⚙️ GitHub Configuration</h2>
            <div id="configStatus" class="status-message"></div>
            <div class="form-group">
                <label>GitHub Username</label>
                <input type="text" id="githubUsername" placeholder="e.g., azhabalouch">
            </div>
            <div class="form-group">
                <label>Repository Name</label>
                <input type="text" id="repoName" placeholder="e.g., blogs-data-api">
            </div>
            <div class="form-group">
                <label>Branch</label>
                <input type="text" id="branchName" value="main">
            </div>
            <div class="form-group">
                <label>GitHub Token (PAT)</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>
            <button class="btn-secondary" onclick="saveConfig()">💾 Save Config</button>
            <button class="btn-secondary" onclick="testConnection()">🔗 Test Connection</button>
        </div>

        <!-- Upload Section -->
        <div class="section">
            <h2>📤 Upload Blog (3 Files)</h2>
            <div id="uploadStatus" class="status-message"></div>
            
            <div class="file-input-wrapper">
                <label class="file-label" for="blogFile">
                    📄 DOCX File (will convert to JSON)
                </label>
                <input type="file" id="blogFile" accept=".docx" onchange="handleFileSelect(this)">
                <div class="file-name" id="blogFileName"></div>
            </div>

            <div class="file-input-wrapper">
                <label class="file-label" for="image1">
                    🖼️ Image 1
                </label>
                <input type="file" id="image1" accept="image/*" onchange="handleFileSelect(this)">
                <div class="file-name" id="image1Name"></div>
            </div>

            <div class="file-input-wrapper">
                <label class="file-label" for="image2">
                    🖼️ Image 2
                </label>
                <input type="file" id="image2" accept="image/*" onchange="handleFileSelect(this)">
                <div class="file-name" id="image2Name"></div>
            </div>

            <button class="btn-secondary" onclick="previewBlog()">👁️ Preview</button>
            <button class="btn-primary" id="uploadBtn" onclick="uploadAll()" disabled>🚀 Upload 3 Files</button>
        </div>

        <!-- Preview Section -->
        <div class="section">
            <h2>👁️ Preview</h2>
            <div class="preview-box" id="previewBox">
                <p style="color: #999; text-align: center;">Select a DOCX file and click Preview</p>
            </div>
        </div>
    </div>

    <script>
        // GitHub Config Management
        const GitHubConfig = {
            save: (config) => localStorage.setItem('githubConfig', JSON.stringify(config)),
            load: () => JSON.parse(localStorage.getItem('githubConfig') || '{}'),
            clear: () => localStorage.removeItem('githubConfig')
        };

        function loadConfig() {
            const config = GitHubConfig.load();
            document.getElementById('githubUsername').value = config.username || '';
            document.getElementById('repoName').value = config.repoName || '';
            document.getElementById('branchName').value = config.branch || 'main';
            document.getElementById('githubToken').value = config.token || '';
        }

        function saveConfig() {
            const config = {
                username: document.getElementById('githubUsername').value,
                repoName: document.getElementById('repoName').value,
                branch: document.getElementById('branchName').value,
                token: document.getElementById('githubToken').value
            };

            if (!config.username || !config.repoName || !config.token) {
                showMessage('configStatus', 'Please fill in all fields', 'error');
                return;
            }

            GitHubConfig.save(config);
            showMessage('configStatus', '✓ Configuration saved', 'success');
        }

        async function testConnection() {
            const config = GitHubConfig.load();
            if (!config.token) {
                showMessage('configStatus', 'Save configuration first', 'error');
                return;
            }

            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${config.token}` }
                });

                if (response.ok) {
                    showMessage('configStatus', '✓ Connection successful!', 'success');
                } else {
                    showMessage('configStatus', '✗ Authentication failed', 'error');
                }
            } catch (error) {
                showMessage('configStatus', `✗ Error: ${error.message}`, 'error');
            }
        }

        function handleFileSelect(input) {
            const fileNameEl = document.getElementById(input.id + 'Name');
            if (input.files.length > 0) {
                fileNameEl.textContent = `Selected: ${input.files[0].name}`;
            } else {
                fileNameEl.textContent = '';
            }
            updateUploadButton();
        }

        function updateUploadButton() {
            const blogFile = document.getElementById('blogFile').files.length > 0;
            document.getElementById('uploadBtn').disabled = !blogFile;
        }

        async function previewBlog() {
            const blogFile = document.getElementById('blogFile').files[0];
            if (!blogFile) {
                showMessage('uploadStatus', 'Select a DOCX file first', 'error');
                return;
            }

            const previewBox = document.getElementById('previewBox');
            previewBox.innerHTML = '<p style="text-align:center;">⏳ Loading...</p>';

            try {
                const arrayBuffer = await blogFile.arrayBuffer();
                const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer});
                
                previewBox.innerHTML = `
                    <h3>${blogFile.name}</h3>
                    <hr style="margin: 15px 0;">
                    <div style="font-family: 'Times New Roman', serif; line-height: 1.6;">
                        ${result.value}
                    </div>
                `;
            } catch (error) {
                previewBox.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function uploadAll() {
            const config = GitHubConfig.load();
            if (!config.username || !config.token) {
                showMessage('uploadStatus', 'Configure GitHub credentials first', 'error');
                return;
            }

            const blogFile = document.getElementById('blogFile').files[0];
            const image1 = document.getElementById('image1').files[0];
            const image2 = document.getElementById('image2').files[0];

            if (!blogFile) {
                showMessage('uploadStatus', 'DOCX file is required', 'error');
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Uploading...';

            try {
                // 1. Convert DOCX to JSON
                showMessage('uploadStatus', '📄 Converting DOCX to JSON...', 'info');
                const arrayBuffer = await blogFile.arrayBuffer();
                const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer});
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = result.value;
                const title = tempDiv.querySelector('h1')?.textContent || blogFile.name.replace('.docx', '');
                const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                
                const blogData = {
                    title: title,
                    author: "Unknown",
                    category: "General",
                    date: new Date().toLocaleDateString('en-US'),
                    excerpt: tempDiv.textContent.substring(0, 200).trim(),
                    featured_image: image1 ? `https://${config.username}.github.io/${config.repoName}/images/${image1.name}` : '',
                    content_images: image2 ? [`https://${config.username}.github.io/${config.repoName}/images/${image2.name}`] : [],
                    content: `<div style="font-family: 'Times New Roman', serif;">${result.value}</div>`,
                    faq: []
                };

                // 2. Upload JSON
                showMessage('uploadStatus', '📄 Uploading JSON (1/3)...', 'info');
                await uploadToGitHub(
                    `blogs/${slug}.json`,
                    btoa(unescape(encodeURIComponent(JSON.stringify(blogData, null, 2)))),
                    `Add blog: ${title}`,
                    config
                );

                // 3. Upload Image 1
                if (image1) {
                    showMessage('uploadStatus', '🖼️ Uploading image 1 (2/3)...', 'info');
                    await uploadToGitHub(
                        `images/${image1.name}`,
                        await fileToBase64(image1),
                        `Add image: ${image1.name}`,
                        config
                    );
                }

                // 4. Upload Image 2
                if (image2) {
                    showMessage('uploadStatus', '🖼️ Uploading image 2 (3/3)...', 'info');
                    await uploadToGitHub(
                        `images/${image2.name}`,
                        await fileToBase64(image2),
                        `Add image: ${image2.name}`,
                        config
                    );
                }

                showMessage('uploadStatus', '✅ Done! All files uploaded. GitHub Actions will rebuild api.json now.', 'success');
                
                // Clear files
                document.getElementById('blogFile').value = '';
                document.getElementById('image1').value = '';
                document.getElementById('image2').value = '';
                document.getElementById('blogFileName').textContent = '';
                document.getElementById('image1Name').textContent = '';
                document.getElementById('image2Name').textContent = '';
                updateUploadButton();

            } catch (error) {
                showMessage('uploadStatus', `✗ Upload failed: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Upload 3 Files';
            }
        }

        async function uploadToGitHub(path, base64Content, message, config) {
            const response = await fetch(
                `https://api.github.com/repos/${config.username}/${config.repoName}/contents/${path}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: message,
                        content: base64Content,
                        branch: config.branch
                    })
                }
            );

            if (!response.ok) {
                const error = await response.text();
                throw new Error(`GitHub API error: ${response.status} - ${error}`);
            }

            return response.json();
        }

        async function fileToBase64(file) {
            const arrayBuffer = await file.arrayBuffer();
            const bytes = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // Initialize
        loadConfig();
        updateUploadButton();
    </script>
</body>
</html>
